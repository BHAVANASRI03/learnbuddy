<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LearnBuddy Pro</title>
<style>
/* (CSS unchanged — kept exactly same) */
html, body { height: 100%; width: 100%; margin:0; padding:0; background:black; color:white; font-family:'Arial',sans-serif; }
header { background:#ff6b81; color:white; text-align:center; padding:25px 0; box-shadow:0 3px 8px rgba(255,255,255,0.2); }
header h1 { margin:0; font-size:2em; }
header p { margin:5px 0 0 0; font-size:1.1em; }
.container { max-width:950px; margin:20px auto; padding:20px; border-radius:15px; background:#111; box-shadow:0 4px 20px rgba(255,255,255,0.1); }
select,input,button { padding:10px; margin:5px 0 15px; width:100%; border-radius:8px; border:1px solid #555; font-size:1em; background:#222; color:white; }
input::placeholder { color:#ccc; }
button { background:#ff6b81; color:white; border:none; cursor:pointer; font-weight:bold; transition:0.3s; }
button:hover { background:#ff4757; }
table { width:100%; border-collapse: collapse; margin-top:10px; color:white; }
th, td { border:1px solid #444; padding:10px; text-align:center; }
th { background:#ff6b81; }
.card { background:#222; padding:15px; margin:12px 0; border-radius:12px; }
.concept { margin:8px 0; padding:10px; background:#333; border-left:4px solid #ff6b81; border-radius:5px; }
.summary { margin:5px 0; font-style:italic; color:#ccc; }
#welcomePageContainer { background:black; color:white; height:100vh; width:100vw; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
#welcomePageContainer h1 { font-size:3em; color:gold; }
</style>
</head>

<body>

<div id="welcomePageContainer">
  <h1>✨ WELCOME! ✨</h1>
  <p>Enter your name to start learning:</p>
  <input type="text" id="userNameInput" placeholder="Your Name" />
  <button onclick="startApp()">Start</button>
</div>

<div id="mainContent" style="display:none;">
<header>
  <h1>LearnBuddy Pro</h1>
  <p>Set Up Your Profile & Study Planner</p>
</header>

<div class="container" id="profilePlannerSection">
<form id="profileForm">
<select id="learningStyle"><option value="visual">Visual</option><option value="auditory">Auditory</option><option value="kinesthetic">Kinesthetic</option></select>
<select id="subject"><option value="math">Math</option><option value="science">Science</option><option value="language">Language</option><option value="coding">Coding</option></select>
<select id="learningSpeed"><option value="slow">Slow Learner</option><option value="average">Average Learner</option><option value="topper">Topper</option></select>
<button type="submit">Start Learning</button>
</form>
</div>

<div class="container" id="dashboard" style="display:none;">
  <h2>Your Learning Materials</h2>
  <div id="conceptContainer"></div>
  <div id="lessonContainer"></div>
  <button id="proceedQuizBtn">Proceed to Quiz</button>
</div>

<div class="container" id="quizSection" style="display:none;">
  <h2>Quiz Time!</h2>
  <div id="challengeContainer"></div>
  <div id="progressBar"><div id="progressFill">0 pts</div></div>
</div>

<script>
let profile={}, currentQuestion=0, points=0, studentName="";

const referenceMaterial={
math:{slow:[{title:"Basic Addition",summary:"Learn simple addition.",concept:"Adding numbers gives a sum.",link:"#"}]},
science:{slow:[{title:"Photosynthesis",summary:"Plants make food.",concept:"Plants use sunlight.",link:"#"}]},
language:{slow:[{title:"Grammar Basics",summary:"Learn nouns & verbs.",concept:"Verb is action.",link:"#"}]},
coding:{slow:[{title:"Programming Basics",summary:"Intro to coding.",concept:"Code gives instructions.",link:"#"}]}
};

const challenges={math:[{q:"2+3=?",a:5}],science:[{q:"H2O is chemical formula of?",a:"water"}],language:[{q:"Synonym of happy?",a:"joyful"}],coding:[{q:"Language for web scripting?",a:"javascript"}]};

function startApp(){
 studentName=document.getElementById('userNameInput').value.trim();
 if(studentName===""){alert("Enter your name");return;}
 alert(`Welcome ${studentName}! Let's start learning 🎉`);
 document.getElementById('welcomePageContainer').style.display="none";
 document.getElementById('mainContent').style.display="block";
}

document.getElementById('profileForm').addEventListener('submit',e=>{
 e.preventDefault();
 profile={subject:subject.value,speed:learningSpeed.value};
 document.getElementById('profilePlannerSection').style.display='none';
 document.getElementById('dashboard').style.display='block';
 showMaterials();
});

function showMaterials(){
 const mat=referenceMaterial[profile.subject][profile.speed];
 let c="<h3>Concepts</h3>";
 mat.forEach(i=>c+=`<div class="concept">${i.concept}</div>`);
 conceptContainer.innerHTML=c;
}

document.getElementById('proceedQuizBtn').onclick=()=>{
 document.getElementById('dashboard').style.display='none';
 document.getElementById('quizSection').style.display='block';
 showQuestion();
}

function showQuestion(){
 let ch=challenges[profile.subject][currentQuestion];
 challengeContainer.innerHTML=`<div class="card">${ch.q}<input id="ans"><button onclick="checkAnswer()">Submit</button></div>`;
}

function checkAnswer(){
 let ans=document.getElementById('ans').value.toLowerCase();
 let ch=challenges[profile.subject][currentQuestion];
 if(ans==ch.a.toString()) points+=10;
 currentQuestion++;
 progressFill.style.width=points+"%";
 progressFill.innerText=points+" pts";
}
</script>

</body>
</html>
