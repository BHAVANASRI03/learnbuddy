<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnBuddy Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- WELCOME SCREEN -->
<section id="welcomePageContainer">
  <h1>✨ Welcome to LearnBuddy Pro ✨</h1>
  <p>Enter your name to start learning</p>
  <input type="text" id="userNameInput" placeholder="Your Name">
  <button id="startBtn">Start Learning</button>
</section>

<!-- MAIN APP -->
<div id="mainContent">

<header>
  <h1>LearnBuddy Pro</h1>
  <p>Smart Learning Planner</p>
</header>

<section class="container" id="profilePlannerSection">
  <h2>Learning Profile</h2>
  <form id="profileForm">
    <select id="learningStyle">
      <option value="visual">Visual</option>
      <option value="auditory">Auditory</option>
      <option value="kinesthetic">Kinesthetic</option>
    </select>

    <select id="subject">
      <option value="math">Math</option>
      <option value="science">Science</option>
      <option value="language">Language</option>
      <option value="coding">Coding</option>
    </select>

    <select id="learningSpeed">
      <option value="slow">Slow Learner</option>
      <option value="average">Average Learner</option>
      <option value="topper">Topper</option>
    </select>

    <button type="submit">Start Learning</button>
  </form>

  <h2>📅 Study Planner</h2>
  <div class="planner-row">
    <input type="text" class="plannerSubject" placeholder="Subject">
    <input type="number" class="plannerTime" placeholder="Minutes">
    <button id="addPlannerBtn">Add</button>
  </div>

  <table id="plannerTable">
    <thead><tr><th>Subject</th><th>Time</th><th>❌</th></tr></thead>
    <tbody></tbody>
  </table>

  <p>Total Planned Time: <span id="totalTime">0</span> mins</p>
  <button id="savePlannerBtn">Save Planner</button>
  <p id="plannerStatus"></p>
</section>

<section class="container" id="dashboard">
  <h2>Learning Materials</h2>
  <div id="conceptContainer"></div>
  <div id="lessonContainer"></div>
  <button id="proceedQuizBtn">Proceed to Quiz</button>
</section>

<section class="container" id="quizSection">
  <h2>Quiz Time</h2>
  <div id="challengeContainer"></div>
  <div id="progressBar"><div id="progressFill">0 pts</div></div>
  <button id="gameBtn">Play Quick Game</button>
</section>

</div>

<script src="app.js"></script>
</body>
</html>
