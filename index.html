<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LearnBuddy Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Welcome Page -->
<div id="welcomePage" class="center-box">
  <h1>Welcome to LearnBuddy Pro</h1>
  <p>Enter your name to start learning</p>
  <input type="text" id="username" placeholder="Your Name" />
  <button id="startBtn">Start Learning</button>
  <p id="errorMsg"></p>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">
  <header>
    <h2>Hello, <span id="displayName"></span> 👋</h2>
    <p>Select a subject to begin</p>
  </header>

  <div class="card-container">
    <div class="card" onclick="selectSubject('Math')">Math</div>
    <div class="card" onclick="selectSubject('Science')">Science</div>
    <div class="card" onclick="selectSubject('Coding')">Coding</div>
  </div>

  <div id="contentArea"></div>
</div>

<script src="app.js"></script>
</body>
</html>
